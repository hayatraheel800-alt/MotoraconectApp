name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: motoraconect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run web:build
      - run: npm run admin:build
